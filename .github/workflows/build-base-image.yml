name: Build Worker Base Image

# Builds base-image/ exactly as committed — no version inputs, so a given commit always produces the
# same image. The tag comes from base-image/VERSION and is never overwritten once published.
on:
  push:
    branches:
      - main
    paths:
      - "base-image/**"
      - ".github/workflows/build-base-image.yml"
  workflow_dispatch:

concurrency:
  group: build-base-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: projectcontinuum/continuum-feature-knime-base

jobs:
  build-base-image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image version
        id: version
        run: |
          version=$(tr -d '[:space:]' < base-image/VERSION)
          if [[ ! "${version}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error file=base-image/VERSION::'${version}' is not a valid image tag"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Before the tag check, so the check also sees tags in a private repository.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # Published tags are immutable: a change under base-image/ needs a new VERSION. Pull requests are
      # checked by validate-versions.yml, so a missing bump is caught before merge.
      - name: Ensure tag is not published yet
        run: |
          ref="${IMAGE}:${{ steps.version.outputs.version }}"
          if out=$(docker buildx imagetools inspect "${ref}" 2>&1); then
            echo "::error file=base-image/VERSION::${ref} is already published — bump base-image/VERSION"
            exit 1
          fi
          # Only a definite "not found" counts as unpublished; registry/network errors must not lead to an overwrite.
          if ! grep -qi 'not found' <<< "${out}"; then
            echo "::error::Could not check whether ${ref} exists: ${out}"
            exit 1
          fi

      # knime-lts-full layers are several GB; the default runner disk is too small without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: base-image
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          push: true
