name: Build Worker Base Image

on:
  workflow_dispatch:
    inputs:
      knime_image:
        description: 'Upstream KNIME image (FROM)'
        required: true
        type: string
        default: 'knime/knime-lts-full:r-5.12.0-114'
      jre_image:
        description: 'Image providing the worker JRE (copied from /opt/java/openjdk)'
        required: true
        type: string
        default: 'eclipse-temurin:21-jre-jammy'
      knime_version:
        description: 'KNIME minor version of knime_image (selects extension update sites, e.g. 5.12)'
        required: true
        type: string
        default: '5.12'
      tag:
        description: 'Tag for projectcontinuum/continuum-feature-knime-base'
        required: true
        type: string
        default: 'r-5.12.0-114-jre21'
      push:
        description: 'Push image to Docker Hub'
        required: true
        type: boolean
        default: false

jobs:
  build-base-image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # knime-lts-full layers are several GB; the default runner disk is too small without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: base-image
          platforms: linux/amd64
          build-args: |
            KNIME_IMAGE=${{ inputs.knime_image }}
            JRE_IMAGE=${{ inputs.jre_image }}
            KNIME_VERSION=${{ inputs.knime_version }}
          tags: projectcontinuum/continuum-feature-knime-base:${{ inputs.tag }}
          push: ${{ inputs.push }}
