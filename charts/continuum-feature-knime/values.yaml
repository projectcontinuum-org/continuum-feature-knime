# ============================================================
# Global settings
# ============================================================
global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

  # Image used by init containers (wait-for-* readiness checks).
  initContainer:
    image:
      repository: busybox
      tag: "1.36"

  # Default nodeSelector applied to the pod. A non-empty featureKnime.nodeSelector overrides this.
  nodeSelector: {}

  # Default tolerations applied to the pod. A non-empty featureKnime.tolerations overrides this.
  tolerations: []

  # Labels applied to every resource created by this chart's templates,
  # merged underneath the component's own labels.
  labels: {}

  # Annotations applied to every resource created by this chart's templates,
  # merged underneath the component's own annotations.
  annotations: {}

# ============================================================
# Continuum — values owned by this chart's own templates
# ============================================================
continuum:

  # ============================================================
  # Infrastructure service references.
  # These MUST match the release name and service names from the
  # continuum-infra chart installed in the same namespace. Defaults below
  # assume continuum-infra was installed under its default release name
  # "continuum-infra" — override every key under this block if a different
  # release name was used.
  # ============================================================
  infra:
    temporal:
      host: continuum-infra-temporal-frontend
      port: 7233
      namespace: default
    kafka:
      brokerList: "PLAINTEXT://continuum-infra-kafka-0.continuum-infra-kafka-headless:19092"
    schemaRegistry:
      url: "http://continuum-infra-schema-registry:8080"
    minio:
      endpoint: "http://continuum-infra-minio:9000"
    # Only required if continuum.scheduler.enabled is true.
    postgresql:
      host: continuum-infra-postgresql
      port: 5432
      database: continuum

  # ============================================================
  # MinIO credentials.
  # This chart does NOT create its own MinIO instance or secret. The
  # continuum-platform chart already creates a Secret with keys
  # root-user/root-password in this namespace. Point at it by name.
  #
  # IMPORTANT: the exact secret name depends on the RELEASE NAME used to
  # install continuum-platform. continuum-platform's own secret-name helper
  # produces "<release-name>-minio-secret", which for the documented default
  # release name "continuum-platform" is "continuum-platform-minio-secret".
  # If continuum-platform was installed under a different release name, you
  # MUST override existingMinioSecret to match.
  # ============================================================
  secrets:
    existingMinioSecret: "continuum-platform-minio-secret"
    # Fallback inline credentials, only used if existingMinioSecret is set to "".
    # Not recommended — prefer existingMinioSecret so this chart never
    # duplicates/diverges from continuum-platform's MinIO credentials.
    minio:
      rootUser: ""
      rootPassword: ""
    # Only required if continuum.scheduler.enabled is true. Same pattern as
    # existingMinioSecret above — point at continuum-platform's own Postgres
    # secret (named "<continuum-platform-release-name>-postgresql-secret")
    # rather than let this chart duplicate/diverge from those credentials.
    existingPostgresqlSecret: "continuum-platform-postgresql-secret"
    postgresql:
      username: ""
      password: ""

  # ============================================================
  # continuum-api-server reachability.
  # This chart has no visibility into continuum-platform's internal Helm
  # fullname, so the API Server location is supplied directly as host+port.
  # Default assumes continuum-platform was installed under release name
  # "continuum-platform" (producing Service continuum-platform-api-server).
  # ============================================================
  apiServer:
    host: continuum-platform-api-server
    port: 8080

  # ============================================================
  # Local cache storage (PVC for temporary workflow data + KNIME
  # workflow/workspace storage).
  # Owned entirely by this chart — not shared with continuum-platform or any
  # other feature chart.
  # ============================================================
  cacheStorage:
    mountPath: /data/continuum-cache
    size: 5Gi
    storageClassName: ""
    accessMode: ReadWriteOnce

  # ============================================================
  # continuum-feature-knime worker
  # ============================================================
  featureKnime:
    enabled: true
    image:
      repository: projectcontinuum/continuum-feature-knime
      tag: ""                      # defaults to .Chart.AppVersion if unset
      pullPolicy: IfNotPresent
    replicas: 1
    taskQueue: CONTINUUM_FEATURE_KNIME_TASK_QUEUE
    # Placeholder resource sizing — tune to the actual KNIME workflow executor workload.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}
    labels:
      deployment: {}
      pod: {}
      pvc: {}
      hpa: {}
    annotations:
      deployment: {}
      pod: {}
      pvc: {}
      hpa: {}

  # ============================================================
  # continuum-knime-scheduler — object-store CRUD proxy + Temporal-schedule
  # orchestration for user-uploaded .knwf files (REST service + embedded UI).
  # ============================================================
  scheduler:
    enabled: true
    image:
      repository: projectcontinuum/continuum-knime-scheduler
      tag: ""                      # defaults to .Chart.AppVersion if unset
      pullPolicy: IfNotPresent
    replicas: 1
    service:
      type: ClusterIP
      port: 8084
    # continuum-credentials-server and continuum-api-server reachability —
    # same host:port shape as continuum.apiServer above, since this chart has
    # no visibility into continuum-platform's internal Helm fullname either.
    apiServerBaseUrl: "http://continuum-platform-api-server:8080"
    credentialsServerBaseUrl: "http://continuum-platform-credentials-server:8080"
    # Public URL the scheduler's own node points executions back at — must be
    # externally reachable (via continuum-cloud-gateway), not cluster-local.
    publicBaseUrl: ""
    storage:
      type: minio
      bucketName: continuum-knime-workflows
      bucketRegion: us-east-2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    labels:
      deployment: {}
      pod: {}
      service: {}
    annotations:
      deployment: {}
      pod: {}
      service: {}
